name: admin-ui
on:
  push:
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui.yml"
  pull_request:
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui.yml"
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
