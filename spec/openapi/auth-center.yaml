openapi: 3.1.0
info:
  title: Unified Auth Center API
  version: 0.1.0
  description: |
    统一认证中心对外接口。

    - **OIDC / OAuth2 端点**遵循 OpenID Connect Core 1.0、RFC 6749、RFC 7636（PKCE）、RFC 7009（revoke）、
      RFC 7662（introspect）、RFC 8693（token exchange）、RFC 9068（JWT Access Token）。此处只列出本平台的约束与扩展。
    - **平台 API**（`/api/v1/*`）供 SDK 与管理后台使用，均需 m2m Bearer Token 并带对应 scope；
      Admin 类接口只对内网开放。
    - 错误响应统一为 `ErrorResponse`，错误码见 `../error-codes.yaml`。
    - SAML IdP（`/saml/*`）与 CAS Server（`/cas/*`）兼容通道遵循各自协议，不在本文件描述。
    - 注册客户端的有效期覆盖见 `ClientLifetimes`。应用注册见 `/api/v1/apps`。
      `client_credentials` 落地前，这些接口接受引导令牌，或 scope 含 `ua.apps.register` 的 m2m access token。
servers:
  - url: https://auth.corp.com
    description: 统一 issuer（内外网 split DNS）

tags:
  - name: oidc
    description: OpenID Connect / OAuth2 标准端点
  - name: sdk
    description: SDK 运行期调用
  - name: app
    description: 应用接入（CI 使用）
  - name: admin
    description: 会话、吊销与应用注册（仅内网）

security:
  - m2m: []

paths:
  /.well-known/openid-configuration:
    get:
      tags: [oidc]
      summary: OIDC Discovery
      security: []
      responses:
        "200":
          description: Discovery 文档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDocument" }

  /oauth2/jwks:
    get:
      tags: [oidc]
      summary: 签名公钥集合
      description: "轮换前同时包含当前密钥与下一把密钥；轮换完成后，上一把密钥继续发布 access_token_ttl_cap + previous_key_buffer 秒。access_token_ttl_cap 为认证中心配置，整数秒，默认 1800，任何客户端的 access token 有效期都不得超过它。previous_key_buffer 默认 60。因此默认一共继续发布 1860 秒。响应带 `Cache-Control: max-age=600`。"
      security: []
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JWKS" }

  /oauth2/authorize:
    get:
      tags: [oidc]
      summary: 授权端点（授权码 + PKCE）
      description: |
        `code_challenge_method` 只接受 `S256`，所有客户端强制 PKCE。`redirect_uri` 精确匹配已注册值。
        已有全局会话时静默返回授权码（单点登录），否则跳转上游 SSO。
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string }, description: "必须含 openid" }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 16 } }
        - { name: nonce, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
        - { name: prompt, in: query, required: false, schema: { type: string, enum: [none, login] } }
        - { name: idp_hint, in: query, required: false, schema: { type: string }, description: "指定上游身份源 ID，多身份源并存时跳过选择页" }
      responses:
        "302":
          description: 跳转上游 SSO、身份源选择页或 redirect_uri（带 code 或 error）

  /oauth2/token:
    post:
      tags: [oidc]
      summary: 令牌端点
      description: |
        支持的 grant_type：
        - `authorization_code`（必须带 code_verifier）
        - `refresh_token`（每次轮换，新 refresh token 从轮换当时起重新计算 refresh_token_ttl；重放旧 refresh token 吊销整个会话链并返回 AUTH_REFRESH_REUSED。会话仍受 idle_timeout 与 absolute_session_ttl 约束）
        - `client_credentials`（m2m，签发 client_type=m2m 的 token）
        - `urn:ietf:params:oauth:grant-type:token-exchange`（小程序 wx code 换取、服务间身份传递）

        机密客户端使用 `client_secret_basic` 或 `private_key_jwt` 认证。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: 签发成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /oauth2/revoke:
    post:
      tags: [oidc]
      summary: 吊销 refresh token（RFC 7009），同时结束对应应用会话
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [refresh_token, access_token] }
      responses:
        "200": { description: 已吊销（对未知 token 同样返回 200） }

  /oauth2/introspect:
    post:
      tags: [oidc]
      summary: Token 内省（RFC 7662），仅内网，供无法本地验签的老系统使用
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: 内省结果；active=true 时附带 access token claims
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean }
                additionalProperties: true

  /oauth2/userinfo:
    get:
      tags: [oidc]
      summary: 用户信息（OIDC UserInfo），字段与可选 claims 一致，缺失即不返回
      security:
        - userBearer: []
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                type: object
                required: [sub]
                properties:
                  sub: { type: string }
                  name: { type: string }
                  email: { type: string }
                  dept_id: { type: string }
                  dept_name: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /oauth2/logout:
    get:
      tags: [oidc]
      summary: RP 发起登出（OIDC RP-Initiated Logout）
      description: 结束全局会话，向所有应用会话发送 back-channel logout，发布 auth.revoked(type=session)，并在上游支持时跳转上游登出。
      security: []
      parameters:
        - { name: id_token_hint, in: query, required: false, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, required: false, schema: { type: string, format: uri } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        "204":
          description: 没有 post_logout_redirect_uri，且上游不支持登出
        "302":
          description: 跳转 post_logout_redirect_uri 或上游登出页
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/apps:
    post:
      tags: [admin]
      summary: 注册应用
      description: |
        返回 `client_id`。机密客户端同时返回只展示一次的 `client_secret`（bcrypt 入库）。
        `web` / `app` / `miniapp` 可设 `public=true`，此时不生成密钥。`ssr` 与 `m2m` 不能公开。
        除 `m2m` 外至少要有一个绝对 `redirect_uri`。`session_policy` 省略的字段使用 §5.2 全局默认。
        需要引导令牌，或 scope `ua.apps.register`。
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreate" }
      responses:
        "201":
          description: 已注册。`client_secret` 只在这次响应里出现
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      tags: [admin]
      summary: 列出应用
      description: 不返回 `client_secret`。需要引导令牌，或 scope `ua.apps.register`。
      security:
        - adminBearer: []
      responses:
        "200":
          description: 应用列表
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{client_id}:
    get:
      tags: [admin]
      summary: 读取一个应用
      description: 不返回 `client_secret`。
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/ClientID" }
      responses:
        "200":
          description: 应用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: 更新应用
      description: |
        可改名称、类型、回调、back-channel 地址、`session_policy` 和 `enabled`。
        不返回密钥。`enabled=false` 记为停用。没有密钥的客户端不能改成 `ssr` 或 `m2m`。
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/ClientID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPatch" }
      responses:
        "200":
          description: 更新后的应用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{client_id}/secret:
    post:
      tags: [admin]
      summary: 轮换客户端密钥
      description: 生成新的 `client_secret`，只在这次响应里返回。旧的 bcrypt 哈希被替换。公开客户端轮换后变为机密客户端。
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/ClientID" }
      responses:
        "200":
          description: 新密钥只展示一次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/revocations:
    get:
      tags: [sdk]
      summary: 拉取吊销事件（启动初始化 / 断线补拉）
      description: 返回 `ts >= since` 且仍在保留期内的事件，按 (ts, id) 升序。需要 scope `ua.revocations.read`。
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer }, description: Unix 秒 }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: 分页游标（上一页的 next_cursor） }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        "200":
          description: 事件列表
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "../schemas/revocation-event.schema.json" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/revocations/stream:
    get:
      tags: [sdk]
      summary: 吊销事件实时流（SSE），供公网/独立部署 SDK 使用
      description: |
        `text/event-stream`。每条消息 `event: auth.revoked` 或 `event: authz.changed`，`id:` 为事件 id，`data:` 为事件 JSON。
        服务端每 15 秒发送 `: ping` 注释保活。断线后 SDK 带 `Last-Event-ID` 重连；超过保留期则先调用 `/api/v1/revocations` 补拉。
        需要 scope `ua.revocations.read`。
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
        - { name: apps, in: query, required: false, schema: { type: string }, description: "逗号分隔，仅接收与这些应用相关的 authz.changed；auth.revoked 总是全量" }
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/authz/users/{sub}/apps/{app}:
    get:
      tags: [sdk]
      summary: 查询用户在某应用下的有效权限
      description: 返回全局角色 ∪ 本应用角色的权限并集与未降级的数据范围。需要 scope `ua.authz.read`，且调用方 client_id 必须等于 {app} 或具有 `ua.authz.read.any`。
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
        - { name: app, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 权限结果
          headers:
            ETag: { schema: { type: string }, description: 值为 perm_ver，支持 If-None-Match 返回 304 }
          content:
            application/json:
              schema: { $ref: "../schemas/authz-result.schema.json" }
        "304": { description: 未变化 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/apps/{app}/permissions:
    put:
      tags: [app]
      summary: 同步应用权限清单（幂等）
      description: |
        以清单为准：新增的创建，变更的更新，清单中缺失的标记 deprecated（已授予角色的仍保留，管理后台提示清理）。
        需要 scope `ua.apps.manage`，且调用方 client_id 必须等于 {app}。`dry_run=true` 只返回差异不落库，用于 CI 预检。
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/permissions-manifest.schema.json" }
          application/yaml:
            schema: { $ref: "../schemas/permissions-manifest.schema.json" }
      responses:
        "200":
          description: 同步结果
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, deprecated, unchanged]
                properties:
                  created: { type: array, items: { type: string } }
                  updated: { type: array, items: { type: string } }
                  deprecated: { type: array, items: { type: string } }
                  unchanged: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/users/{sub}/sessions:
    get:
      tags: [admin]
      summary: 列出用户当前会话（全局会话及其应用会话）
      description: 需要 scope `ua.sessions.read`。用户本人通过管理后台查看自己的会话时使用用户 token。
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /api/v1/users/{sub}/revoke:
    post:
      tags: [admin]
      summary: 强制下线用户的全部会话
      description: 吊销所有全局会话与 refresh token，发布 auth.revoked(type=user, not_before=now)。需要 scope `ua.sessions.manage`。
      parameters:
        - { name: sub, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200": { description: 已吊销, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeResult" } } } }

  /api/v1/sessions/{sid}:
    delete:
      tags: [admin]
      summary: 强制下线某个全局会话（所有应用）
      description: 发布 auth.revoked(type=session)。需要 scope `ua.sessions.manage`。
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200": { description: 已吊销, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeResult" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/app-sessions/{asid}:
    delete:
      tags: [admin]
      summary: 强制下线某个应用会话（只影响单个应用）
      description: 发布 auth.revoked(type=app_session)。需要 scope `ua.sessions.manage`。
      parameters:
        - { name: asid, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200": { description: 已吊销, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeResult" } } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    m2m:
      type: oauth2
      description: 平台 API 使用 client_credentials 获取的 m2m token
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            ua.revocations.read: 读取吊销 / 权限变更事件
            ua.authz.read: 读取本应用用户权限
            ua.authz.read.any: 读取任意应用用户权限（网关 / 平台组件）
            ua.apps.manage: 同步本应用权限清单
            ua.sessions.read: 查询会话
            ua.sessions.manage: 强制下线
            ua.apps.register: 注册和更新应用
    adminBearer:
      type: http
      scheme: bearer
      description: |
        P1 在 client_credentials 落地前，管理接口接受环境变量 AUTH_CENTER_ADMIN_TOKEN，
        或 typ=at+jwt、client_type=m2m、scope 含 ua.apps.register 的 access token。
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientID:
      name: client_id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }

  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema: { $ref: "../schemas/error-response.schema.json" }

  schemas:
    DiscoveryDocument:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, response_types_supported, subject_types_supported, id_token_signing_alg_values_supported]
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        introspection_endpoint: { type: string, format: uri }
        end_session_endpoint: { type: string, format: uri }
        backchannel_logout_supported: { type: boolean }
        response_types_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        id_token_signing_alg_values_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        ua_revocations_endpoint: { type: string, format: uri, description: 本平台扩展 }
        ua_revocations_stream_endpoint: { type: string, format: uri, description: 本平台扩展 }
        ua_authz_endpoint: { type: string, description: "本平台扩展，URI 模板 /api/v1/authz/users/{sub}/apps/{app}" }
      additionalProperties: true

    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg]
            properties:
              kty: { type: string, enum: [RSA, EC] }
              kid: { type: string }
              use: { const: sig }
              alg: { type: string, enum: [RS256, ES256] }
              n: { type: string }
              e: { type: string }
              crv: { const: P-256 }
              x: { type: string }
              y: { type: string }

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - client_credentials
            - urn:ietf:params:oauth:grant-type:token-exchange
        code: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
        client_id: { type: string }
        subject_token: { type: string, description: "token-exchange：用户 access token，或小程序 wx.login code" }
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:corp:params:oauth:token-type:wechat_miniapp_code
        audience: { type: string, description: token-exchange 目标应用 client_id }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string, description: m2m 不返回 }
        id_token: { type: string, description: 仅 authorization_code 且 scope 含 openid }
        scope: { type: string }
        issued_token_type: { type: string, description: 仅 token-exchange }

    Session:
      type: object
      required: [sid, sub, dc, idp, created_at, last_active_at, expires_at, app_sessions]
      properties:
        sid: { type: string }
        sub: { type: string }
        dc: { type: string }
        idp: { type: string }
        ip: { type: string }
        ua: { type: string }
        created_at: { type: integer }
        last_active_at: { type: integer }
        expires_at: { type: integer, description: 绝对过期时间 }
        app_sessions:
          type: array
          items:
            type: object
            required: [asid, client_id, client_type, created_at, last_active_at]
            properties:
              asid: { type: string }
              client_id: { type: string }
              client_type: { type: string, enum: [web, ssr, app, miniapp] }
              created_at: { type: integer }
              last_active_at: { type: integer }

    ClientLifetimes:
      type: object
      description: |
        注册客户端 `session_policy` 中的有效期覆盖，单位秒。省略的字段使用该 client_type 的全局默认（设计文档 §5.2）。
        access_token_ttl 的有效值不得超过全局 access_token_ttl_cap（默认 1800）。
        m2m 不使用 refresh_token_ttl、idle_timeout、absolute_session_ttl。
        应用注册见 `/api/v1/apps`。省略的字段使用该 client_type 的全局默认。
      properties:
        access_token_ttl:
          type: integer
          minimum: 1
          description: 用户客户端全局默认 600，m2m 全局默认 1800。有效值取 min(本字段或全局默认, access_token_ttl_cap)
        refresh_token_ttl:
          type: integer
          minimum: 1
          description: 仅用户客户端。省略时用全局默认 600 秒，与 absolute_session_ttl 无关。每次轮换从当时起重新计算。会话仍受 idle_timeout 与 absolute_session_ttl 约束，先到期者生效。m2m 不签发 refresh token
        idle_timeout:
          type: integer
          minimum: 1
          description: web/ssr 全局默认 7200，app/miniapp 全局默认 604800。m2m 不适用
        absolute_session_ttl:
          type: integer
          minimum: 1
          description: web/ssr 全局默认 43200，app/miniapp 全局默认 2592000。m2m 不适用
      additionalProperties: false

    App:
      type: object
      required: [client_id, name, client_type, redirect_uris, enabled, public]
      properties:
        client_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        name: { type: string }
        client_type: { type: string, enum: [web, ssr, app, miniapp, m2m] }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        backchannel_logout_uri: { type: string, format: uri }
        session_policy: { $ref: "#/components/schemas/ClientLifetimes" }
        enabled: { type: boolean }
        public: { type: boolean, description: 没有密钥的 web、app 或 miniapp }
        client_secret: { type: string, description: 只在注册和轮换时返回一次 }
      additionalProperties: false

    AppCreate:
      type: object
      required: [name, client_type]
      properties:
        client_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$', description: 省略时由服务生成 }
        name: { type: string }
        client_type: { type: string, enum: [web, ssr, app, miniapp, m2m] }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        backchannel_logout_uri: { type: string, format: uri }
        session_policy: { $ref: "#/components/schemas/ClientLifetimes" }
        public: { type: boolean, description: 为 true 时不生成密钥，仅 web、app、miniapp }
      additionalProperties: false

    AppPatch:
      type: object
      properties:
        name: { type: string }
        client_type: { type: string, enum: [web, ssr, app, miniapp, m2m] }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        backchannel_logout_uri: { type: string, format: uri }
        session_policy: { $ref: "#/components/schemas/ClientLifetimes" }
        enabled: { type: boolean }
      additionalProperties: false

    RevokeRequest:
      type: object
      description: |
        管理员调用强制下线接口时可选的原因。`reason` 与吊销事件 `reason` 使用同一份枚举。
        未传时默认为 `admin_kick`。
        发布的事件 `type` 由所调用的接口决定（用户全部会话、单个全局会话或单个应用会话），与 `reason` 无关。
      properties:
        reason:
          type: string
          enum: [logout, admin_kick, policy_kick_oldest, idle_timeout, absolute_timeout, refresh_reused, risk, client_disabled, user_disabled]
          default: admin_kick
          description: 写入 auth.revoked.reason 与审计。取值与 revocation-event.schema.json 的 reason 枚举相同。
        comment: { type: string, maxLength: 256, description: 写入审计 }

    RevokeResult:
      type: object
      required: [revoked_sessions, event_ids]
      properties:
        revoked_sessions: { type: integer }
        event_ids: { type: array, items: { type: string } }
