services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  auth-center:
    build:
      context: ..
      dockerfile: auth-center/Dockerfile
    environment:
      AUTH_CENTER_ISSUER: http://localhost:8080
      AUTH_CENTER_DC: local
      AUTH_CENTER_HTTP_ADDR: ":8080"
      AUTH_CENTER_POSTGRES_DSN: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      AUTH_CENTER_REDIS_ADDR: redis:6379
      AUTH_CENTER_LOG_LEVEL: info
      AUTH_CENTER_KEY_ACTIVE_ALG: RS256
      AUTH_CENTER_KEY_ACTIVE_PEM_FILE: /keys/active.pem
    volumes:
      - ./.dev-keys/active.pem:/keys/active.pem:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
